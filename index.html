<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Midjourney niji 7 用の英語プロンプトを選択式で組み立てる Prompt Builder">
  <title>niji 7 Prompt Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">MIDJOURNEY NIJI 7</p>
        <h1>Prompt Builder</h1>
        <p class="subtitle">選んでいくだけで、niji 7 用の英語プロンプトを組み立てるのだ。</p>
      </div>
      <button id="resetButton" class="ghost-button" type="button">最初から</button>
    </header>

    <main>
      <section class="progress-panel" aria-label="進行状況">
        <div class="progress-top">
          <span id="stepLabel">STEP 1 / 8</span>
          <span id="stepTitle">基本設定</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="progressDots" class="progress-dots"></div>
      </section>

      <section id="builderView" class="builder-view"></section>

      <section id="resultView" class="result-view hidden" aria-live="polite">
        <div class="result-card">
          <div class="result-heading">
            <div>
              <p class="eyebrow">COMPLETED</p>
              <h2>プロンプト完成</h2>
            </div>
            <button id="copyButton" class="primary-button" type="button">コピー</button>
          </div>
          <textarea id="promptOutput" readonly aria-label="生成された英語プロンプト"></textarea>
          <div class="result-actions">
            <button id="editButton" class="secondary-button" type="button">選択を修正</button>
            <button id="newButton" class="secondary-button" type="button">新しく作る</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>Prompt Builder for Midjourney niji 7</span>
      <span>英語プロンプトは選択内容から自動生成されます</span>
    </footer>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
